<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>TechStore</title>
</head>
<body>
    <header>
        <div class="titulo">
            <h1>TECH<span>STORE</span></h1>
            <p>PREMIUM ELETRONICS</p>
        </div>

        <button id="btnCart">
            <i class="bi bi-cart2"></i>
            Cart
        </button>
    </header>
    <main>
        <section class="filtro">
            <form action="" id="formFilter">
                <i class="bi bi-funnel"></i>
                <select name="" id="selectFilter">

                    <option value="todos">
                        Todos
                    </option>
                    <option value="ate 50">
                        Até R$50
                    </option>
                    <option value="acima 50">
                        Acima de R$50
                    </option>
                </select>

                <button class="btnFilter">Filtrar</button>
            </form>
        </section>
            
        <section class="listaProdutos">
            <form action="" id="formProdutos">

                <div class="divProdutos">
                    <img src="src/imagens/imgFoneBluetooth.webp" alt="">
                    <p class="nomeProd">Fone de Ouvido Bluetooth</p>
                    <p class="pPreco">PREÇO</p>
                    
                    <div class="divPrecoButton">
                        <p class="precoProd">49.90<span>$</span></p>
                        <button type="submit" class="btnAddProd">
                            <i class="bi bi-cart2"></i>Add</button>
                    </div>
                </div>

                <div class="divProdutos">
                    <img src="src/imagens/imgMouse.jpeg" alt="">
                    <p class="nomeProd">Mouse Gamer RGB</p>
                    <p class="pPreco">PREÇO</p>
                    
                    <div class="divPrecoButton">
                        <p class="precoProd">89.90<span>$</span></p>
                        <button type="submit" class="btnAddProd">
                            <i class="bi bi-cart2"></i>Add</button>
                    </div>
                </div>

                <div class="divProdutos">
                    <img src="src/imagens/imgSmartwatch.jpeg" alt="">
                    <p class="nomeProd">Smartwatch Fitness</p>
                    <p class="pPreco">PREÇO</p>
                    
                    <div class="divPrecoButton">
                        <p class="precoProd">599.90<span>$</span></p>
                        <button type="submit" class="btnAddProd">
                            <i class="bi bi-cart2"></i>Add</button>
                    </div>
                </div>

                <div class="divProdutos">
                    <img src="src/imagens/imgFoneSport.webp" alt="">
                    <p class="nomeProd">Fone de Ouvido Sport</p>
                    <p class="pPreco">PREÇO</p>
                    
                    <div class="divPrecoButton">
                        <p class="precoProd">149.90<span>$</span></p>
                        <button type="submit" class="btnAddProd">
                            <i class="bi bi-cart2"></i>Add</button>
                    </div>
                </div>

                <div class="divProdutos">
                    <img src="src/imagens/imgWebCam.webp" alt="">
                    <p class="nomeProd">Webcam Full HD</p>
                    <p class="pPreco">PREÇO</p>
                    
                    <div class="divPrecoButton">
                        <p class="precoProd">199.90<span>$</span></p>
                        <button type="submit" class="btnAddProd">
                            <i class="bi bi-cart2"></i>Add</button>
                    </div>
                </div>
                
            </form>
        </section>
        
        
        <dialog id="modalCart">
            <div class="modalTopo">
                <div class="modalHeader">
                    <div class="modalIcone">
                        <i class="bi bi-cart2"></i>
                    </div>
                    <div>
                        <h2>CARRINHO</h2>
                        <p id="contadorItens">0 itens</p>
                    </div>
                </div>
                <button id="btnFecharModal">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div id="cartVazio">
                <i class="bi bi-cart2"></i>
                <p class="textoVazioTitulo">Carrinho Vazio</p>
                <p class="textoVazioSub">Adicione produtos para começar</p>
            </div>

            <div id="cartItens"></div>

            <div id="cartRodape">
                <div class="totalArea">
                    <p class="totalLabel">TOTAL</p>
                    <p class="totalValor"><span id="totalNum">0,00</span> <span class="totalMoeda">R$</span></p>
                </div>
                <button id="btnFinalizar">FINALIZAR</button>
            </div>
        </dialog>
    </main>





    <script src="src/script.js"></script>
</body>

</html>
